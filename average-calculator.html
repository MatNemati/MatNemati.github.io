<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatNemati — محاسبه معدل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0066cc; --ink: #1d1d1f; --ink-muted: #7a7a7a; --ink-muted80: #333333;
    --canvas: #ffffff; --parchment: #f5f5f7; --hairline: #e0e0e0; --divider: #f0f0f0;
    --on-primary: #ffffff;
  }
  [data-theme="dark"] {
    --primary: #2997ff; --ink: #f5f5f7; --ink-muted: #8e8e93; --ink-muted80: rgba(245,245,247,0.75);
    --canvas: #000000; --parchment: #1c1c1e; --hairline: rgba(255,255,255,0.14); --divider: rgba(255,255,255,0.09);
    --on-primary: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--canvas); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; transition: background .3s ease; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #000; }
  header .logo { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
  header button { width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.14); border: none; color: #fff; cursor: pointer; font-size: 14px; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 18px 60px; }
  .intro { text-align: center; margin-bottom: 24px; }
  .intro .eyebrow { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 6px; }
  .intro h1 { color: var(--ink); font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .intro p { color: var(--ink-muted80); font-size: 14px; line-height: 1.7; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--parchment); padding: 5px; border-radius: 999px; }
  .tabs button { flex: 1; padding: 10px; border: none; border-radius: 999px; font-family: 'Vazirmatn', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: var(--ink); transition: all .2s ease; }
  .tabs button.active { background: var(--primary); color: var(--on-primary); }
  .subjects { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .row { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 14px; padding: 14px 16px; }
  .row-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .row-top .name { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .row-top .weight { font-size: 11.5px; color: var(--ink-muted); background: var(--parchment); padding: 3px 9px; border-radius: 999px; }
  .row-bottom { display: flex; align-items: center; gap: 10px; }
  .row-bottom input[type=number] {
    flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--hairline);
    background: var(--canvas); color: var(--ink); font-family: 'Vazirmatn', sans-serif; font-size: 15px; text-align: center;
  }
  .row-bottom input[type=number]:disabled { opacity: 0.35; }
  .exempt-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); white-space: nowrap; cursor: pointer; }
  .exempt-label input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .row.is-exempt { opacity: 0.55; }
  .calc-btn {
    width: 100%; padding: 14px; border-radius: 999px; border: none; background: var(--primary); color: var(--on-primary);
    font-family: 'Vazirmatn', sans-serif; font-size: 15.5px; font-weight: 700; cursor: pointer; margin-bottom: 18px;
  }
  .result { background: var(--parchment); border-radius: 16px; padding: 24px; text-align: center; display: none; }
  .result.show { display: block; }
  .result .label { font-size: 13px; color: var(--ink-muted); margin-bottom: 8px; }
  .result .value { font-size: 44px; font-weight: 700; color: var(--primary); }
  .result .note { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
  .warn { color: #c4402c; font-size: 13px; text-align: center; margin-bottom: 14px; display: none; }
  .warn.show { display: block; }
</style>
</head>
<body data-theme="light">

<header>
  <span class="logo">MatNemati</span>
  <button id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>

<main>
  <div class="intro">
    <div class="eyebrow">ابزار سریع</div>
    <h1>محاسبه معدل</h1>
    <p>رشته‌ات رو انتخاب کن، نمره هر درس رو وارد کن و معدل رو ببین.</p>
  </div>

  <div class="tabs">
    <button id="tab-tajrobi" onclick="selectMajor('tajrobi')">تجربی</button>
    <button id="tab-riazi" onclick="selectMajor('riazi')">ریاضی</button>
  </div>

  <div class="subjects" id="subjects"></div>

  <div class="warn" id="warn">لطفاً نمره‌ی همه‌ی درس‌های فعال رو وارد کن.</div>

  <button class="calc-btn" onclick="calculate()">محاسبه معدل</button>

  <div class="result" id="result">
    <div class="label">معدل تو</div>
    <div class="value" id="resultValue">-</div>
    <div class="note" id="resultNote"></div>
  </div>
</main>

<script>
const MAJORS = {
  tajrobi: { label: "تجربی", subjects: [
    { name: "فارسی", w: 11.09 },
    { name: "عربی", w: 4.64 },
    { name: "دینی", w: 8.47 },
    { name: "زبان انگلیسی", w: 6.05 },
    { name: "سلامت و بهداشت", w: 1.76 },
    { name: "علوم اجتماعی", w: 1.31 },
    { name: "زیست‌شناسی", w: 11.45 },
    { name: "ریاضی ۳", w: 6.55 },
    { name: "فیزیک ۳", w: 5.9 },
    { name: "شیمی ۳", w: 9.44 },
  ]},
  riazi: { label: "ریاضی", subjects: [
    { name: "فارسی", w: 11.09 },
    { name: "عربی", w: 4.64 },
    { name: "دینی", w: 8.47 },
    { name: "زبان انگلیسی", w: 6.05 },
    { name: "سلامت و بهداشت", w: 1.76 },
    { name: "علوم اجتماعی", w: 1.31 },
    { name: "حسابان ۲", w: 7.47 },
    { name: "هندسه ۳", w: 4.41 },
    { name: "فیزیک ۳", w: 10.59 },
    { name: "شیمی ۳", w: 7.33 },
    { name: "گسسته", w: 3.73 },
  ]},
};

let currentMajor = "tajrobi";

function selectMajor(key) {
  currentMajor = key;
  document.getElementById("tab-tajrobi").classList.toggle("active", key === "tajrobi");
  document.getElementById("tab-riazi").classList.toggle("active", key === "riazi");
  renderSubjects();
  document.getElementById("result").classList.remove("show");
  document.getElementById("warn").classList.remove("show");
}

function renderSubjects() {
  const container = document.getElementById("subjects");
  container.innerHTML = "";
  MAJORS[currentMajor].subjects.forEach((s, i) => {
    const id = `subj-${currentMajor}-${i}`;
    const row = document.createElement("div");
    row.className = "row";
    row.id = `row-${id}`;
    row.innerHTML = `
      <div class="row-top">
        <span class="name">${s.name}</span>
        <span class="weight">${s.w}٪</span>
      </div>
      <div class="row-bottom">
        <input type="number" id="score-${id}" min="0" max="20" step="0.01" placeholder="نمره از ۲۰" />
        <label class="exempt-label">
          <input type="checkbox" id="exempt-${id}" onchange="toggleExempt('${id}')" />
          غیبت موجه (بی‌تاثیر)
        </label>
      </div>
    `;
    container.appendChild(row);
  });
}

function toggleExempt(id) {
  const checked = document.getElementById(`exempt-${id}`).checked;
  const input = document.getElementById(`score-${id}`);
  const row = document.getElementById(`row-${id}`);
  input.disabled = checked;
  if (checked) input.value = "";
  row.classList.toggle("is-exempt", checked);
}

function calculate() {
  const subjects = MAJORS[currentMajor].subjects;
  let totalWeighted = 0, totalWeight = 0, missing = false;

  subjects.forEach((s, i) => {
    const id = `subj-${currentMajor}-${i}`;
    const exempt = document.getElementById(`exempt-${id}`).checked;
    if (exempt) return;
    const raw = document.getElementById(`score-${id}`).value;
    if (raw === "" || isNaN(raw)) { missing = true; return; }
    const score = Math.max(0, Math.min(20, parseFloat(raw)));
    totalWeighted += score * s.w;
    totalWeight += s.w;
  });

  const warnEl = document.getElementById("warn");
  const resultEl = document.getElementById("result");

  if (missing || totalWeight === 0) {
    warnEl.classList.add("show");
    resultEl.classList.remove("show");
    return;
  }

  warnEl.classList.remove("show");
  const avg = totalWeighted / totalWeight;
  document.getElementById("resultValue").textContent = avg.toFixed(2);
  document.getElementById("resultNote").textContent = `رشته‌ی ${MAJORS[currentMajor].label} — بر اساس ${subjects.filter((s,i)=>!document.getElementById(`exempt-subj-${currentMajor}-${i}`).checked).length} درس`;
  resultEl.classList.add("show");
}

function toggleTheme() {
  const body = document.body;
  const isDark = body.getAttribute("data-theme") === "dark";
  body.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = isDark ? "🌙" : "☀️";
}

selectMajor("tajrobi");
</script>

</body>
</html>
