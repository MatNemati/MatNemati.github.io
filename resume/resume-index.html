<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatNemati — رزومه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: #f5f5f7; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #000; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  header .logo { color: #fff; font-weight: 700; font-size: 15px; }
  header a { color: #fff; font-size: 13px; text-decoration: none; background: #0066cc; padding: 7px 14px; border-radius: 999px; }
  .viewer-wrap { flex: 1; padding: 14px; }
  iframe { width: 100%; height: 100%; min-height: 78vh; border: 1px solid #e0e0e0; border-radius: 12px; background: #fff; }
  .fallback { text-align: center; padding: 20px; font-size: 13px; color: #7a7a7a; }
  .fallback a { color: #0066cc; font-weight: 600; }
</style>
</head>
<body>

<header>
  <span class="logo">MatNemati</span>
  <a href="resume.pdf" download>دانلود PDF</a>
</header>

<div class="viewer-wrap">
  <iframe src="resume.pdf"></iframe>
</div>

<div class="fallback">
  اگه فایل نمایش داده نشد، <a href="resume.pdf" target="_blank">اینجا مستقیم بازش کن</a>.
</div>

</body>
</html>
