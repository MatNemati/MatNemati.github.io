<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Minimal 3D Brain</title>

<style>

    html,

    body {

        width: 100%;

        height: 100%;

        margin: 0;

        overflow: hidden;

        background: #f6f6f1;

    }

    body {

        font-family: Arial, sans-serif;

        touch-action: none;

    }

    #canvas {

        width: 100%;

        height: 100%;

        display: block;

    }

    #loading {

        position: fixed;

        left: 50%;

        top: 50%;

        transform: translate(-50%, -50%);

        color: #8c9698;

        font-size: 14px;

        letter-spacing: 1px;

        pointer-events: none;

    }

    #error {

        display: none;

        position: fixed;

        left: 50%;

        top: 50%;

        transform: translate(-50%, -50%);

        width: min(80%, 500px);

        text-align: center;

        color: #777;

        line-height: 1.6;

    }

    #credit {

        position: fixed;

        bottom: 12px;

        left: 50%;

        transform: translateX(-50%);

        font-size: 10px;

        color: rgba(100, 110, 110, 0.45);

        pointer-events: none;

    }

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="loading">

    LOADING BRAIN

</div>

<div id="error">

    مدل مغز بارگذاری نشد.<br>

    فایل HTML را با یک local server اجرا کن.

</div>

<div id="credit">

    3D anatomy: Z-Anatomy / BodyParts3D

</div>

<script type="importmap">

{

    "imports": {

        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }

}

</script>

<script type="module">

import * as THREE from "three";

import { OrbitControls } from

    "three/addons/controls/OrbitControls.js";

import { GLTFLoader } from

    "three/addons/loaders/GLTFLoader.js";

import { DRACOLoader } from

    "three/addons/loaders/DRACOLoader.js";

/* --------------------------------------------------

   BASIC SETUP

-------------------------------------------------- */

const canvas = document.getElementById("canvas");

const renderer = new THREE.WebGLRenderer({

    canvas: canvas,

    antialias: true,

    alpha: true

});

renderer.setPixelRatio(

    Math.min(window.devicePixelRatio, 2)

);

renderer.setSize(

    window.innerWidth,

    window.innerHeight

);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

/* --------------------------------------------------

   SCENE

-------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xf6f6f1);

/* --------------------------------------------------

   CAMERA

-------------------------------------------------- */

const camera = new THREE.PerspectiveCamera(

    35,

    window.innerWidth / window.innerHeight,

    0.01,

    1000

);

camera.position.set(

    0,

    0.1,

    3

);

/* --------------------------------------------------

   CONTROLS

-------------------------------------------------- */

const controls = new OrbitControls(

    camera,

    renderer.domElement

);

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enablePan = false;

controls.minDistance = 0.8;

controls.maxDistance = 7;

controls.autoRotate = false;

controls.autoRotateSpeed = 0.35;

/* --------------------------------------------------

   LIGHTING

-------------------------------------------------- */

const ambient = new THREE.HemisphereLight(

    0xffffff,

    0xdfe3e3,

    2.5

);

scene.add(ambient);

const keyLight = new THREE.DirectionalLight(

    0xffffff,

    3

);

keyLight.position.set(

    3,

    5,

    6

);

scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(

    0xdde8eb,

    1.5

);

fillLight.position.set(

    -4,

    1,

    3

);

scene.add(fillLight);

/* --------------------------------------------------

   BRAIN GROUP

-------------------------------------------------- */

const brainGroup = new THREE.Group();

scene.add(brainGroup);

/* --------------------------------------------------

   GLTF + DRACO

-------------------------------------------------- */

const loader = new GLTFLoader();

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(

    "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"

);

loader.setDRACOLoader(dracoLoader);

/*

   Real anatomical brain model.

   Z-Anatomy / BodyParts3D

*/

const BRAIN_URL =

    "https://cdn.jsdelivr.net/gh/DrMuratAltun/beyin-simulatoru@main/brain.glb";

/* --------------------------------------------------

   NETWORK

-------------------------------------------------- */

const networkGroup = new THREE.Group();

brainGroup.add(networkGroup);

/* --------------------------------------------------

   LOAD BRAIN

-------------------------------------------------- */

loader.load(

    BRAIN_URL,

    function (gltf) {

        const brain = gltf.scene;

        brainGroup.add(brain);

        /*

           Make anatomy clean and monochrome.

        */

        brain.traverse(function (object) {

            if (!object.isMesh) {

                return;

            }

            object.castShadow = true;

            object.receiveShadow = true;

            const material =

                new THREE.MeshPhysicalMaterial({

                    color: 0xe9eeee,

                    roughness: 0.78,

                    metalness: 0.0,

                    transmission: 0.02,

                    transparent: true,

                    opacity: 0.88,

                    clearcoat: 0.15,

                    clearcoatRoughness: 0.7

                });

            object.material = material;

        });

        /*

           Center the model.

        */

        const box =

            new THREE.Box3().setFromObject(brain);

        const center =

            box.getCenter(new THREE.Vector3());

        brain.position.sub(center);

        /*

           Scale model to a predictable size.

        */

        const size =

            box.getSize(new THREE.Vector3());

        const maxSize =

            Math.max(

                size.x,

                size.y,

                size.z

            );

        const scale =

            2.25 / maxSize;

        brain.scale.setScalar(scale);

        /*

           Build neural network after

           the brain has been normalized.

        */

        createNetwork();

        document.getElementById(

            "loading"

        ).style.display = "none";

    },

    undefined,

    function (error) {

        console.error(error);

        document.getElementById(

            "loading"

        ).style.display = "none";

        document.getElementById(

            "error"

        ).style.display = "block";

    }

);

/* --------------------------------------------------

   MINIMAL NEURAL NETWORK

-------------------------------------------------- */

function createNetwork() {

    /*

       Coordinates are deliberately sparse.

       They create a conceptual neural

       connectivity layer rather than

       covering the entire brain.

    */

    const nodes = [

        [-0.78,  0.42,  0.30],

        [-0.45,  0.62,  0.34],

        [-0.05,  0.52,  0.38],

        [ 0.32,  0.67,  0.34],

        [ 0.70,  0.48,  0.30],

        [-0.58,  0.05,  0.46],

        [-0.18,  0.18,  0.51],

        [ 0.25,  0.13,  0.48],

        [ 0.63,  0.10,  0.40],

        [-0.35, -0.25,  0.43],

        [ 0.08, -0.20,  0.46],

        [ 0.43, -0.23,  0.39]

    ];

    const connections = [

        [0,1],

        [1,2],

        [2,3],

        [3,4],

        [0,5],

        [1,6],

        [2,6],

        [2,7],

        [3,7],

        [4,8],

        [5,6],

        [6,7],

        [7,8],

        [5,9],

        [6,9],

        [6,10],

        [7,10],

        [8,11],

        [9,10],

        [10,11]

    ];

    /*

       Lines

    */

    const lineMaterial =

        new THREE.LineBasicMaterial({

            color: 0xc6ced0,

            transparent: true,

            opacity: 0.65

        });

    connections.forEach(function (connection) {

        const a =

            nodes[connection[0]];

        const b =

            nodes[connection[1]];

        const geometry =

            new THREE.BufferGeometry();

        geometry.setFromPoints([

            new THREE.Vector3(

                a[0],

                a[1],

                a[2]

            ),

            new THREE.Vector3(

                b[0],

                b[1],

                b[2]

            )

        ]);

        const line =

            new THREE.Line(

                geometry,

                lineMaterial

            );

        networkGroup.add(line);

    });

    /*

       Nodes

    */

    nodes.forEach(function (position, index) {

        const geometry =

            new THREE.SphereGeometry(

                index % 4 === 0

                    ? 0.035

                    : 0.025,

                16,

                16

            );

        const material =

            new THREE.MeshBasicMaterial({

                color: 0xffffff,

                transparent: true,

                opacity: 0.95

            });

        const node =

            new THREE.Mesh(

                geometry,

                material

            );

        node.position.set(

            position[0],

            position[1],

            position[2]

        );

        networkGroup.add(node);

    });

}

/* --------------------------------------------------

   RESIZE

-------------------------------------------------- */

window.addEventListener(

    "resize",

    function () {

        camera.aspect =

            window.innerWidth /

            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

        renderer.setPixelRatio(

            Math.min(window.devicePixelRatio, 2)

        );

    }

);

/* --------------------------------------------------

   ANIMATION

-------------------------------------------------- */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(

        scene,

        camera

    );

}

animate();

</script>

</body>

</html>
