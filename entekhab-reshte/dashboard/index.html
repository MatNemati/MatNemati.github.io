<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatNemati — پنل دانش‌آموز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --ink-muted: #7a7a7a;
    --hairline: #e5e5e5; --primary: #0066cc; --primary-soft: #eaf2fd; --nav-bg: #000000;
  }
  [data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --ink-muted: #9a9a9a;
    --hairline: rgba(255,255,255,0.12); --primary: #2997ff; --primary-soft: rgba(41,151,255,0.14); --nav-bg: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); min-height: 100vh; }

  header { background: var(--nav-bg); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .menu-btn, .theme-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  header .logo { color: #fff; font-weight: 700; font-size: 16px; }
  .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: none; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 78%; max-width: 300px; background: var(--surface); z-index: 50; transform: translateX(-100%); transition: transform .28s ease; padding: 18px 0; }
  .drawer.open { transform: translateX(0); }
  .drawer-header { padding: 0 18px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--hairline); margin-bottom: 8px; }
  .drawer-header .title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .drawer-header button { background: none; border: none; font-size: 18px; color: var(--ink-muted); cursor: pointer; }
  .drawer-item { display: flex; align-items: center; gap: 10px; padding: 13px 18px; font-size: 14.5px; color: var(--ink); background: none; border: none; width: 100%; text-align: right; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }
  .drawer-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .drawer-item.disabled { color: #9a9a9a; cursor: default; }
  .drawer-item .soon { font-size: 11px; color: #9a9a9a; margin-right: auto; }

  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .welcome-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .welcome-card .name { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .welcome-card .sub { font-size: 12.5px; color: var(--ink-muted); }
  .progress-track { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 14px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .4s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-muted); margin-top: 6px; }

  .section-title { font-size: 14px; font-weight: 700; color: var(--ink); margin: 20px 0 10px; }
  .field-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hairline); font-family: 'Vazirmatn', sans-serif; font-size: 13.5px; background: var(--bg); color: var(--ink); }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .target-majors-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .target-chip { background: var(--primary-soft); color: var(--primary); font-size: 12px; padding: 5px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; }
  .target-chip button { background: none; border: none; color: var(--primary); cursor: pointer; }
  .add-major-row { display: flex; gap: 8px; }
  .add-major-row input { flex: 1; }
  .add-major-row button { background: var(--primary-soft); color: var(--primary); border: none; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .save-btn { width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 999px; background: var(--primary); color: #fff; font-family: 'Vazirmatn', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
  .msg { font-size: 13px; text-align: center; margin-top: 12px; padding: 9px; border-radius: 10px; display: none; }
  .msg.error { background: #fdecea; color: #c4402c; display: block; }
  .msg.success { background: #eaf6ec; color: #1e7d34; display: block; }

  .coming-soon { text-align: center; padding: 60px 20px; color: var(--ink-muted); font-size: 14px; }
  .loading-screen { text-align: center; padding: 80px 20px; color: var(--ink-muted); }
</style>
</head>
<body>

<header>
  <div class="header-right">
    <button class="menu-btn" id="menuBtn">☰</button>
    <span class="logo">MatNemati</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="theme-btn" id="themeBtn">🌙</button>
    <button class="logout-btn" id="logoutBtn">خروج</button>
  </div>
</header>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header"><span class="title">پنل دانش‌آموز</span><button id="closeDrawer">✕</button></div>
  <button class="drawer-item active" data-tab="profile">پروفایل من</button>
  <button class="drawer-item disabled" disabled>آزمون‌ها <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>ویدیوها <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>انتخاب رشته هوشمند <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>وضعیت پرونده <span class="soon">به‌زودی</span></button>
</div>

<main id="mainContent">
  <div class="loading-screen">در حال بارگذاری...</div>
</main>

<script src="../auth.js"></script>
<script>
// theme
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) { document.body.setAttribute('data-theme', t); themeBtn.textContent = t === 'dark' ? '☀️' : '🌙'; }
applyTheme(localStorage.getItem('mn-theme') || 'light');
themeBtn.onclick = () => { const n = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; localStorage.setItem('mn-theme', n); applyTheme(n); };

// drawer
const drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay');
document.getElementById('menuBtn').onclick = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
document.getElementById('closeDrawer').onclick = closeDrawer;
overlay.onclick = closeDrawer;
function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
document.querySelectorAll('.drawer-item:not(.disabled)').forEach(btn => btn.addEventListener('click', closeDrawer));

document.getElementById('logoutBtn').onclick = async () => { await signOut(); window.location.href = "../login/"; };

let currentProfile = null;
let targetMajors = [];

(async function init() {
  const profile = await getCurrentUserProfile();
  if (!profile) { window.location.href = "../login/"; return; }
  if (profile.role !== 'student') {
    // این پنل فقط مخصوص دانش‌آموزه
    window.location.href = profile.role === 'admin' ? "../admin/" : "../advisor/";
    return;
  }
  currentProfile = profile;
  targetMajors = profile.target_majors || [];
  renderPanel();
})();

function calcCompleteness(p) {
  const optionalFields = ['gpa', 'rank', 'city', 'region'];
  const filled = optionalFields.filter(f => p[f] !== null && p[f] !== undefined && p[f] !== '').length;
  const hasTargets = (p.target_majors && p.target_majors.length > 0) ? 1 : 0;
  return Math.round(((filled + hasTargets) / (optionalFields.length + 1)) * 100);
}

function renderPanel() {
  const pct = calcCompleteness(currentProfile);
  document.getElementById('mainContent').innerHTML = `
    <div class="tab-content active" id="tab-profile">
      <div class="welcome-card">
        <div class="name">سلام ${currentProfile.first_name} 👋</div>
        <div class="sub">${currentProfile.field_of_study} — ${currentProfile.grade_level === 'konkur' ? 'کنکوری' : 'دوازدهمی'}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>تکمیل پروفایل</span><span>${pct}٪</span></div>
      </div>

      <div class="section-title">تکمیل اطلاعات (اختیاری)</div>
      <div class="field-card">
        <div class="row2">
          <div class="field"><label>معدل</label><input type="number" step="0.01" min="0" max="20" id="gpaInput" value="${currentProfile.gpa ?? ''}" /></div>
          <div class="field"><label>رتبه</label><input type="number" min="1" id="rankInput" value="${currentProfile.rank ?? ''}" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>شهر</label><input type="text" id="cityInput" value="${currentProfile.city ?? ''}" /></div>
          <div class="field">
            <label>منطقه</label>
            <select id="regionInput">
              <option value="" ${!currentProfile.region ? 'selected' : ''} disabled>انتخاب کن</option>
              <option value="1" ${currentProfile.region == 1 ? 'selected' : ''}>منطقه ۱</option>
              <option value="2" ${currentProfile.region == 2 ? 'selected' : ''}>منطقه ۲</option>
              <option value="3" ${currentProfile.region == 3 ? 'selected' : ''}>منطقه ۳</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>رشته‌های هدف</label>
          <div class="target-majors-list" id="targetMajorsList"></div>
          <div class="add-major-row">
            <input type="text" id="newMajorInput" placeholder="مثلاً مهندسی کامپیوتر..." />
            <button id="addMajorBtn" type="button">افزودن</button>
          </div>
        </div>

        <button class="save-btn" id="saveProfileBtn">ذخیره تغییرات</button>
        <div class="msg" id="saveMsg"></div>
      </div>
    </div>
  `;
  renderTargetMajors();
  document.getElementById('addMajorBtn').onclick = addTargetMajor;
  document.getElementById('newMajorInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTargetMajor(); } });
  document.getElementById('saveProfileBtn').onclick = saveProfile;
}

function renderTargetMajors() {
  const el = document.getElementById('targetMajorsList');
  if (targetMajors.length === 0) { el.innerHTML = '<span style="font-size:12px;color:var(--ink-muted)">هنوز رشته‌ای اضافه نکردی</span>'; return; }
  el.innerHTML = targetMajors.map((m, i) => `<span class="target-chip">${m} <button data-i="${i}">✕</button></span>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { targetMajors.splice(parseInt(b.dataset.i), 1); renderTargetMajors(); });
}

function addTargetMajor() {
  const input = document.getElementById('newMajorInput');
  const val = input.value.trim();
  if (val && !targetMajors.includes(val)) { targetMajors.push(val); renderTargetMajors(); }
  input.value = '';
}

async function saveProfile() {
  const btn = document.getElementById('saveProfileBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  msg.className = 'msg';

  const optionalFields = {
    gpa: document.getElementById('gpaInput').value ? parseFloat(document.getElementById('gpaInput').value) : null,
    rank: document.getElementById('rankInput').value ? parseInt(document.getElementById('rankInput').value) : null,
    city: document.getElementById('cityInput').value.trim() || null,
    region: document.getElementById('regionInput').value ? parseInt(document.getElementById('regionInput').value) : null,
    konkurPercentages: currentProfile.konkur_percentages || null,
    targetMajors: targetMajors.length ? targetMajors : null,
  };

  const { error } = await updateOptionalProfile(currentProfile.id, optionalFields);
  btn.disabled = false;

  if (error) { msg.className = 'msg error'; msg.textContent = 'خطا: ' + error.message; return; }
  msg.className = 'msg success'; msg.textContent = 'ذخیره شد!';
  currentProfile = { ...currentProfile, gpa: optionalFields.gpa, rank: optionalFields.rank, city: optionalFields.city, region: optionalFields.region, target_majors: targetMajors };
  document.querySelector('.progress-fill').style.width = calcCompleteness(currentProfile) + '%';
  document.querySelector('.progress-label span:last-child').textContent = calcCompleteness(currentProfile) + '٪';
}
</script>

</body>
</html>
