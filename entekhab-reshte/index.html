<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatNemati — انتخاب رشته هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: #f5f5f7; min-height: 100vh; }

  header { background: #000; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .menu-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px; }
  header .logo { color: #fff; font-weight: 700; font-size: 16px; }
  .auth-buttons { display: flex; gap: 8px; }
  .auth-buttons a { text-decoration: none; font-size: 13.5px; font-weight: 600; padding: 9px 18px; border-radius: 999px; }
  .btn-login { color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  .btn-signup { background: #0066cc; color: #fff; }

  .hero { text-align: center; padding: 36px 20px 22px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .hero h1 { font-size: 23px; font-weight: 700; color: #1d1d1f; margin-bottom: 8px; }
  .hero p { font-size: 14px; color: #7a7a7a; max-width: 460px; margin: 0 auto; line-height: 1.7; }
  .current-tab-label { text-align: center; padding: 14px 16px 0; font-size: 13px; color: #0066cc; font-weight: 700; }

  /* --- drawer menu (opens from physical left) --- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: none; }
  .overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 78%; max-width: 300px; background: #fff; z-index: 50;
    transform: translateX(-100%); transition: transform .28s ease; display: flex; flex-direction: column; padding: 18px 0;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header { padding: 0 18px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; margin-bottom: 8px; }
  .drawer-header .title { font-weight: 700; font-size: 15px; color: #1d1d1f; }
  .drawer-header button { background: none; border: none; font-size: 18px; color: #9a9a9a; cursor: pointer; }
  .drawer-item {
    display: flex; align-items: center; gap: 10px; padding: 13px 18px; font-size: 14.5px; color: #1d1d1f;
    background: none; border: none; width: 100%; text-align: right; cursor: pointer; font-family: 'Vazirmatn', sans-serif;
  }
  .drawer-item.active { background: #eaf2fd; color: #0066cc; font-weight: 700; }
  .drawer-item.disabled { color: #c7c7c7; cursor: default; }
  .drawer-item .soon { font-size: 11px; color: #c7c7c7; margin-right: auto; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .intro-sub { text-align: center; margin-bottom: 16px; }
  .intro-sub p { color: #7a7a7a; font-size: 13px; }

  .filters { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .filters input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #e0e0e0;
    font-family: 'Vazirmatn', sans-serif; font-size: 14px; color: #1d1d1f; background: #fff;
  }
  .filters-row { display: flex; gap: 8px; }
  .filters-row > * { flex: 1; min-width: 0; }

  /* --- multiselect combobox --- */
  .msel { position: relative; }
  .msel-box {
    min-height: 42px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 6px 10px; display: flex;
    flex-wrap: wrap; gap: 5px; align-items: center; cursor: text; background: #fff;
  }
  .msel-chip { background: #eaf2fd; color: #0066cc; font-size: 12px; padding: 4px 8px; border-radius: 999px; display: flex; align-items: center; gap: 5px; }
  .msel-chip button { background: none; border: none; color: #0066cc; cursor: pointer; font-size: 12px; line-height: 1; }
  .msel-box input { flex: 1; min-width: 60px; border: none; outline: none; font-family: 'Vazirmatn', sans-serif; font-size: 13.5px; padding: 4px; }
  .msel-placeholder { color: #9a9a9a; font-size: 13.5px; padding: 4px; }
  .msel-dropdown {
    position: absolute; top: calc(100% + 4px); right: 0; left: 0; background: #fff; border: 1px solid #e0e0e0;
    border-radius: 10px; max-height: 200px; overflow-y: auto; z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: none;
  }
  .msel-dropdown.open { display: block; }
  .msel-option { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13.5px; color: #1d1d1f; cursor: pointer; }
  .msel-option:hover { background: #f5f5f7; }
  .msel-option input { pointer-events: none; }
  .msel-empty { padding: 10px 12px; font-size: 12.5px; color: #9a9a9a; }

  .meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: #7a7a7a; margin-bottom: 10px; padding: 0 4px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .card-top .name { font-size: 14.5px; font-weight: 700; color: #1d1d1f; }
  .card-top .code { font-size: 11px; color: #9a9a9a; white-space: nowrap; }
  .card-sub { font-size: 12.5px; color: #48484a; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #f5f5f7; color: #1d1d1f; }
  .tag.capacity { background: #eaf6ec; color: #1e7d34; }
  .notes { font-size: 11.5px; color: #c4402c; margin-top: 6px; }
  .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
  .pagination button { padding: 9px 16px; border-radius: 999px; border: 1px solid #e0e0e0; background: #fff; font-family: 'Vazirmatn', sans-serif; font-size: 13px; cursor: pointer; }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination span { font-size: 12.5px; color: #7a7a7a; }
  .empty { text-align: center; padding: 40px 20px; color: #9a9a9a; font-size: 13.5px; }
</style>
</head>
<body>

<header>
  <div class="header-right">
    <button class="menu-btn" id="menuBtn">☰</button>
    <span class="logo">MatNemati</span>
  </div>
  <div class="auth-buttons">
    <a href="login/" class="btn-login">ورود</a>
    <a href="signup/" class="btn-signup">ثبت‌نام</a>
  </div>
</header>

<div class="hero">
  <h1>انتخاب رشته هوشمند</h1>
  <p>بر اساس علاقه، اولویت‌ها و شرایط واقعی کنکور — قدم‌به‌قدم مسیر دانشگاهت رو پیدا کن.</p>
</div>
<div class="current-tab-label" id="currentTabLabel">لیست رشته‌ها و دانشگاه‌ها</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="title">بخش‌ها</span>
    <button id="closeDrawer">✕</button>
  </div>
  <button class="drawer-item active" data-tab="majors">لیست رشته‌ها و دانشگاه‌ها</button>
  <button class="drawer-item disabled" disabled>آزمون‌ها <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>ویدیوها <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>انتخاب رشته هوشمند <span class="soon">به‌زودی</span></button>
  <button class="drawer-item disabled" disabled>وضعیت پرونده <span class="soon">به‌زودی</span></button>
</div>

<main>
  <div class="tab-content active" id="tab-majors">
    <div class="intro-sub"><p>گروه ریاضی و فنی — کنکور سراسری ۱۴۰۴</p></div>

    <div class="filters">
      <input type="text" id="searchBox" placeholder="جستجوی نام رشته یا دانشگاه..." />
      <div class="filters-row">
        <div class="msel" id="msel-province" data-placeholder="همه‌ی استان‌ها"></div>
        <div class="msel" id="msel-major" data-placeholder="همه‌ی رشته‌ها"></div>
      </div>
      <div class="filters-row">
        <div class="msel" id="msel-zone" data-placeholder="همه‌ی انواع پذیرش"></div>
        <div class="msel" id="msel-gender" data-placeholder="هر جنسیتی"></div>
      </div>
      <select id="sortBy" style="padding:10px 12px;border-radius:10px;border:1px solid #e0e0e0;font-family:'Vazirmatn',sans-serif;font-size:14px;">
        <option value="default">مرتب‌سازی: پیش‌فرض</option>
        <option value="capacity_desc">بیشترین ظرفیت</option>
        <option value="name_asc">نام رشته (الفبا)</option>
        <option value="university_asc">نام دانشگاه (الفبا)</option>
      </select>
    </div>

    <div class="meta-bar"><span id="resultCount">در حال بارگذاری...</span></div>
    <div id="results"></div>
    <div class="pagination" id="pagination" style="display:none">
      <button id="prevBtn">قبلی</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">بعدی</button>
    </div>
  </div>
</main>

<script>
// --- drawer menu ---
const drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay');
document.getElementById('menuBtn').onclick = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
document.getElementById('closeDrawer').onclick = closeDrawer;
overlay.onclick = closeDrawer;
function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }

document.querySelectorAll('.drawer-item:not(.disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.drawer-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    document.getElementById('currentTabLabel').textContent = btn.textContent.trim();
    closeDrawer();
  });
});

// --- reusable searchable multi-select ---
function MultiSelect(containerId, options) {
  const el = document.getElementById(containerId);
  const placeholder = el.dataset.placeholder;
  let selected = new Set();
  let allOptions = options;

  el.innerHTML = `
    <div class="msel-box" tabindex="0">
      <span class="msel-placeholder" id="${containerId}-ph">${placeholder}</span>
      <input type="text" id="${containerId}-input" autocomplete="off" style="display:none" />
    </div>
    <div class="msel-dropdown" id="${containerId}-dd"></div>
  `;
  const box = el.querySelector('.msel-box');
  const input = el.querySelector('input');
  const ph = document.getElementById(containerId + '-ph');
  const dd = document.getElementById(containerId + '-dd');

  function renderChips() {
    box.querySelectorAll('.msel-chip').forEach(c => c.remove());
    if (selected.size === 0) { ph.style.display = 'inline'; }
    else {
      ph.style.display = 'none';
      [...selected].forEach(val => {
        const chip = document.createElement('span');
        chip.className = 'msel-chip';
        chip.innerHTML = `${val} <button data-val="${val}">✕</button>`;
        chip.querySelector('button').onclick = (e) => { e.stopPropagation(); selected.delete(val); renderChips(); renderDropdown(); el.dispatchEvent(new Event('change')); };
        box.insertBefore(chip, input);
      });
    }
  }

  function renderDropdown(filterText = '') {
    const filtered = allOptions.filter(o => o.includes(filterText));
    if (filtered.length === 0) { dd.innerHTML = '<div class="msel-empty">چیزی پیدا نشد</div>'; return; }
    dd.innerHTML = filtered.map(o => `
      <div class="msel-option" data-val="${o}">
        <input type="checkbox" ${selected.has(o) ? 'checked' : ''} />
        <span>${o}</span>
      </div>
    `).join('');
    dd.querySelectorAll('.msel-option').forEach(opt => {
      opt.onclick = () => {
        const val = opt.dataset.val;
        if (selected.has(val)) selected.delete(val); else selected.add(val);
        renderChips(); renderDropdown(input.value); el.dispatchEvent(new Event('change'));
      };
    });
  }

  box.addEventListener('click', () => { input.style.display = 'inline-block'; input.focus(); dd.classList.add('open'); renderDropdown(input.value); });
  input.addEventListener('input', () => renderDropdown(input.value));
  document.addEventListener('click', (e) => { if (!el.contains(e.target)) { dd.classList.remove('open'); if (selected.size === 0) input.style.display='none'; } });

  renderChips(); renderDropdown();
  return { getSelected: () => selected, setOptions: (opts) => { allOptions = opts; } };
}

// --- majors list logic ---
const PAGE_SIZE = 30;
let ALL_ROWS = [], filteredRows = [], currentPage = 1;
let provinceMsel, majorMsel, zoneMsel, genderMsel;

Papa.parse("majors-full-data.csv", {
  download: true, header: true, skipEmptyLines: true,
  complete: (res) => {
    ALL_ROWS = res.data;
    const provinces = [...new Set(ALL_ROWS.map(r => r.province).filter(Boolean))].sort();
    const majors = [...new Set(ALL_ROWS.map(r => r.major_name).filter(Boolean))].sort();

    provinceMsel = MultiSelect('msel-province', provinces);
    majorMsel = MultiSelect('msel-major', majors);
    zoneMsel = MultiSelect('msel-zone', ['کشوری','ناحیهای','استانی','قطبی']);
    genderMsel = MultiSelect('msel-gender', ['هر دو','فقط زن','فقط مرد']);

    ['msel-province','msel-major','msel-zone','msel-gender'].forEach(id =>
      document.getElementById(id).addEventListener('change', applyFilters)
    );
    applyFilters();
  },
  error: () => { document.getElementById("results").innerHTML = '<div class="empty">مشکلی در بارگذاری داده پیش اومد.</div>'; }
});

function applyFilters() {
  const q = document.getElementById("searchBox").value.trim();
  const provinces = provinceMsel.getSelected();
  const majors = majorMsel.getSelected();
  const zones = zoneMsel.getSelected();
  const genders = genderMsel.getSelected();
  const sortBy = document.getElementById("sortBy").value;

  filteredRows = ALL_ROWS.filter(r => {
    if (q && !r.major_name.includes(q) && !r.university.includes(q)) return false;
    if (provinces.size && !provinces.has(r.province)) return false;
    if (majors.size && !majors.has(r.major_name)) return false;
    if (zones.size && !zones.has(r.admission_zone_type)) return false;
    if (genders.size && !genders.has(r.gender)) return false;
    return true;
  });

  if (sortBy === "capacity_desc") filteredRows.sort((a,b) => (parseInt(b.capacity_1)||0) - (parseInt(a.capacity_1)||0));
  else if (sortBy === "name_asc") filteredRows.sort((a,b) => a.major_name.localeCompare(b.major_name,'fa'));
  else if (sortBy === "university_asc") filteredRows.sort((a,b) => a.university.localeCompare(b.university,'fa'));

  currentPage = 1;
  render();
}

function render() {
  const resultsEl = document.getElementById("results");
  const total = filteredRows.length;
  document.getElementById("resultCount").textContent = `${total.toLocaleString('fa-IR')} کد رشته پیدا شد`;
  if (total === 0) { resultsEl.innerHTML = '<div class="empty">چیزی با این فیلترها پیدا نشد.</div>'; document.getElementById("pagination").style.display = "none"; return; }

  const totalPages = Math.ceil(total / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filteredRows.slice(start, start + PAGE_SIZE);

  resultsEl.innerHTML = pageRows.map(r => `
    <div class="card">
      <div class="card-top"><span class="name">${r.major_name}</span><span class="code">کد ${r.code}</span></div>
      <div class="card-sub">${r.university} — ${r.province}</div>
      <div class="tags">
        <span class="tag">${r.admission_zone_type || 'نامشخص'}</span>
        <span class="tag">${r.study_type}</span>
        <span class="tag">${r.admission_type}</span>
        <span class="tag">${r.gender}</span>
        <span class="tag capacity">ظرفیت: ${r.capacity_1}</span>
      </div>
      ${r.notes ? `<div class="notes">${r.notes}</div>` : ''}
    </div>
  `).join('');

  document.getElementById("pagination").style.display = "flex";
  document.getElementById("pageInfo").textContent = `صفحه ${currentPage} از ${totalPages}`;
  document.getElementById("prevBtn").disabled = currentPage === 1;
  document.getElementById("nextBtn").disabled = currentPage === totalPages;
}

document.getElementById("searchBox").addEventListener("input", debounce(applyFilters, 250));
document.getElementById("sortBy").addEventListener("change", applyFilters);
document.getElementById("prevBtn").addEventListener("click", () => { currentPage--; render(); window.scrollTo(0,0); });
document.getElementById("nextBtn").addEventListener("click", () => { currentPage++; render(); window.scrollTo(0,0); });
function debounce(fn, delay) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), delay); }; }
</script>

</body>
</html>
