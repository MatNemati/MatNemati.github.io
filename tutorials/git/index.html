<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git | Tutorial</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --cream:#faf7ef;
    --card:#ffffff;
    --navy:#22304d;
    --ink:#33383f;
    --gray:#6f7580;
    --line:#e2ddce;
    --shadow: rgba(34,48,77,0.10);
    --code-bg:#1f2a3d;
    --code-text:#eef1f6;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:7vh 6vw 10vh;
  }
  .stage{ width:100%; max-width:640px; }

  .back-link{
    display:inline-block;
    margin-bottom:22px;
    font-size:0.85rem;
    color:var(--gray);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color 0.25s ease, border-color 0.25s ease;
  }
  .back-link:hover{ color:var(--navy); border-color:var(--line); }

  .header{ margin-bottom:30px; }
  .header h1{
    margin:0;
    font-weight:700;
    font-size:1.7rem;
    color:var(--navy);
  }
  .header p{
    margin:8px 0 0;
    font-size:0.9rem;
    color:var(--gray);
  }

  .entry-list{ display:flex; flex-direction:column; gap:22px; }

  .entry{
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{ border-bottom:none; }

  .entry .term{
    margin:0 0 6px;
    font-size:1.05rem;
    font-weight:700;
    color:var(--navy);
  }
  .entry .def{
    margin:0 0 10px;
    font-size:0.92rem;
    line-height:1.7;
    color:var(--ink);
  }

  .code-box{
    position:relative;
    background:var(--code-bg);
    padding:12px 44px 12px 14px;
    overflow-x:auto;
  }
  .code-box code{
    direction:ltr;
    display:block;
    text-align:left;
    unicode-bidi:plaintext;
    font-family:'SFMono-Regular', Consolas, 'Courier New', monospace;
    font-size:0.85rem;
    color:var(--code-text);
    white-space:pre;
  }
  .copy-btn{
    position:absolute;
    top:8px;
    left:8px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--code-text);
    font-family:'Vazirmatn', sans-serif;
    font-size:0.72rem;
    padding:3px 9px;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .copy-btn:hover{ background:rgba(255,255,255,0.16); }
  .copy-btn.copied{ background:rgba(120,180,120,0.35); }

  /*
    ================== قالب برای افزودن مفهوم جدید ==================
    این بلاک رو کپی کن، داخل .entry-list (هرجا خواستی) اضافه کن،
    و متن‌ها رو عوض کن. اگه دستور کد نداره، کل تگ code-box رو حذف کن.

    <div class="entry">
      <h3 class="term">عنوان</h3>
      <p class="def">توضیح خیلی کوتاه و خلاصه</p>
      <div class="code-box">
        <code>دستور یا کد</code>
        <button class="copy-btn" onclick="copyCode(this)">کپی</button>
      </div>
    </div>
    ===================================================================
  */
</style>
</head>
<body>
  <div class="stage">
    <a class="back-link" href="../index.html">← Back  </a>

    <div class="header">
      <h1>Git</h1>
      <p>دستورات و مفاهیم پایه، برای مرور سریع</p>
    </div>

    <div class="entry-list">

    </div>
  </div>

<script>
function copyCode(btn){
  var code = btn.parentElement.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(function(){
    var original = btn.textContent;
    btn.textContent = 'کپی شد';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1200);
  });
}
</script>
</body>
</html>
